.boxed-content[
Don't learn to fly an AI on your **flagship pipeline.** Start on small, **low-stakes** projects — ideally ones that aren't even science: near-zero cost of mistakes, fast feedback, and you learn the **failure modes** before they touch your data.

# First, what's a *Skill*?

.boxed-content[
A **Skill** is a folder the agent can choose to use. Minimum: one `SKILL.md` — YAML frontmatter (between `---` fences) plus instructions:

```yaml
# SKILL.md frontmatter
name: s2-query
description: Search Semantic Scholar for academic papers...
  Use this whenever the user wants to find references.
allowed-tools: Read, Bash
```

- The **description** is the trigger: the model reads it and decides *when* the skill applies.
- The body is **instructions**; alongside it you ship **`scripts/`** the agent runs.
- Same idea in Claude Code and Codex — portable, version-controlled, yours.
]

.center[*The references fix is just **two** of these: `/s2-query` and `/zotero`.*]

???

# `/zotero` — keeping the library sane

.boxed-content[
The second skill syncs a Zotero library with a CSL-JSON `library.json`:

| `/zotero ...` | does |
|---|---|
| `pull` / *(none)* | Zotero &rarr; `library.json` |
| `push` | new items &rarr; Zotero |
| `sync` | pull then push |
| `status` | counts, last sync, unpushed |
| `search QUERY` | S2 &rarr; **CrossRef-verify** &rarr; CSL-JSON &rarr; dedupe &rarr; push |

The `search` path is why a new citation is **guaranteed real and on-topic**: every DOI is verified against CrossRef before it touches the library.
]

.center[*`/s2-query` finds it · `/zotero` verifies, de-dupes, and files it. Vigilance, automated.*]

???

- Subcommand table verbatim from zotero/SKILL.md. CrossRef verification = the trust guarantee.

# Two chores I handed off — to the *agent*, not a subcommand

.boxed-content[
These aren't built-in commands. They're plain-English asks the agent runs **over `library.json`, using `/s2-query` as a verifier:**

.pull-left[
**"Organize my library by topic."**

The agent reads every entry, clusters by abstract, and writes back Zotero collections — *fMRI preprocessing*, *diffusion*, *brain age*, …
]
.pull-right[
**"Which of my preprints are now published?"**

For each preprint it re-queries Semantic Scholar, finds the published DOI, and updates the entry in place.
]

*The skill supplies trustworthy data + a verified search; the agent supplies the judgment to reorganize.*
]

.center[*Low stakes, real time saved — and every change is a small, reviewable diff to `library.json`.*]

# Real stakes need a written contract

.boxed-content[
Now that the stakes are real, the **first piece of structure** appears. I own the **specification**; the agent executes inside it. That contract lives in a `CLAUDE.md`:

```markdown
## Code conventions
- Python scripts use only stdlib (no pip dependencies beyond DataLad ecosystem)
- `build_abide_both.py` supports `--dry-run` for safe testing
- Shell scripts use `set -euo pipefail`
- Scripts must be runnable from repo root using relative paths
- Commit style: conventional prefixes (`enh:`, `fix:`, `doc:`, `chore:`)
```

.center[*All executions recorded with `datalad containers-run` — provenance is non-negotiable.*]
]

# Steering moment ①: a bug we caught together

.boxed-content[
Shell globs were passed **literally** to `datalad get/drop` — "path does not exist." I named the invariant (*only fetch symlinks that actually exist*); the agent wrote the guarded loop:

```diff
-datalad get "${SUBJECT}/ses-1/func/..._desc-preproc_bold.nii.gz"
+for f in ${SUBJECT}/ses-1/func/..._desc-preproc_bold.nii.gz; do
+    [ -L "$f" ] && datalad get "$f" 2>/dev/null || true
+done
```

The agent had the breadth to sweep every site; **I** supplied the invariant that made the fix correct.
]

.center[*Normal engineering friction at scale — not an "AI mistake." Diagnosed* with *the agent.*]

???

- Glob hunk verbatim from commit `4b9e640` (`code/analysis_extract.sbatch`).

# ③ But a *good* model has a ceiling

.boxed-content[
The partnership scales. Then it hits a wall: when the agent needs to know **exactly how a tool behaves** — a flag, an API, a default — a good model **fabricates.**

And here is the trap: a **bigger** model doesn't save you.

> *"The largest models were generally the least truthful… scaling up models alone is less promising for improving truthfulness than fine-tuning using training objectives other than imitation of text from the web."*
> — Lin, Hilton &amp; Evans, *TruthfulQA* (ACL 2022)

.center[### The fix isn't a bigger model. It's **grounding.**]
]

???

- Inverse scaling: TruthfulQA found *larger* models more likely to repeat imitative falsehoods. Verified cite: DOI 10.18653/v1/2022.acl-long.229.
- Web (`WebFetch`) fixes the answer but is slow, costly, brittle — the motivation for a curated wiki. Ties to Ben Dichter's RAG talk.

---

# Where it fabricates: an *imitative falsehood*

.boxed-content[
I asked an agent a **trap question** *(one editable line — swap freely):*

.center[*"Which QSIPrep flag writes outputs in MNI space?"*]

.pull-left[
**It confidently answered**

`qsiprep … --output-spaces`
`MNI152NLin2009cAsym`
]
.pull-right[
**The truth**

QSIPrep has **no `--output-spaces` flag** — that's fMRIPrep's. The premise was false; the model played along.
]

**Imitative falsehood** *(Lin, Hilton &amp; Evans, 2022)*: the answer with highest likelihood under the training distribution — `--output-spaces` is real *in fMRIPrep*, so the model transplants it. Compounded here by **false-premise compliance**: the question presupposes the flag exists.
]

.center[*Fluent. Confident. Wrong. Grounding fixes **both** halves.*]

???

- The hybrid: imitative falsehood (plausible flag from a sibling tool) × sycophancy to a false premise. Caught/corrected in commit `91048ab`.
- NEUTRAL-POLAR ALT (swap the question line for a purer imitative falsehood): *"Does QSIPrep have a flag to write outputs in MNI space?"* — a confident "yes, --output-spaces" is then near-pure imitative falsehood.
- Cite verified: DOI 10.18653/v1/2022.acl-long.229.
