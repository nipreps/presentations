# What it wrote — the CV manager's CLAUDE.md

.boxed-content[
.codescroll[
````markdown
# CLAUDE.md

This file provides guidance to Claude Code (claude.ai/code) when working with code in this repository.

## Status

This repository is greenfield: at the time of writing it contains no code, only this guidance. The notes below describe the intended system. As the codebase materializes, replace planned descriptions with concrete commands and file references, and keep this file in sync with reality.

## Purpose

A personal CV system for Oscar Esteban (ORCID-backed academic CV) with three pillars:

1. **ORCID synchronization** — bidirectional sync between the local records and the user's ORCID profile (publications, grants, employment, education). Treat ORCID and the local YAML database as two replicas that must converge; any sync logic needs a conflict story (which side wins, how divergence is detected and surfaced).
2. **A YAML publication database** — the source of truth for all scholarly output, stratified by record type: journal papers, oral conference presentations, poster presentations, invited talks, software contributions, Stage 1 registered reports, preprints, and similar. The stratification is a first-class concept — record type drives how an item is rendered, deduplicated, and matched against ORCID.
3. **PDF/LaTeX CV generation** — tooling that compiles CV variants (e.g., long-form, short-form, topic-tailored) to PDF from the YAML database via LaTeX. This tooling is expected to be tested.

When designing data structures, the YAML schema is the architectural center of gravity: ORCID sync reads/writes it, and the LaTeX generator reads it. Changes to the schema ripple into both. Keep one canonical schema and avoid letting the generator or the sync layer accrete their own divergent representations.

## Commit conventions

Use [Conventional Commits](https://www.conventionalcommits.org/): a type prefix on every subject line, e.g. `enh:`, `fix:`, `chore:`, `docs:`, `test:`, `refactor:`. Keep the body as short as the change allows — omit it for trivial changes. Always add yourself as a co-author trailer:

```
Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>
```

## Pull request conventions

All changes land through PRs — do not push directly to the default branch.

- **Title**: conventional-commit type in ALLCAPS, e.g. `FIX: Correct publication date of Esteban et al. (2019)`.
- **Body**: more descriptive than a commit body but not over-explained; state what changed and why, skip the play-by-play.
- **Issue linkage**: when a PR closes an issue, include the closing keyword, e.g. `Fixes: #340`.

## Working notes

- The data is biographical and citation-bearing — correctness of dates, DOIs, author lists, and venue names matters more than throughput. Prefer surfacing a suspected discrepancy over silently "fixing" a record.
- The LaTeX toolchain (pdflatex/lualatex/latexmk, BibTeX/biblatex) is a build dependency for PDF generation; reach for the `latex` skill when writing or debugging `.tex` sources, and the `zotero` skill if reference management connects to a Zotero library.

# The `/s2-query` skill

.boxed-content[
.codescroll[

````markdown
---
name: s2-query
description: >
  Search Semantic Scholar for academic papers. Returns structured results with
  metadata (title, authors, year, venue, DOI, citation count, abstract).
  Supports year range and citation count filters. Use this skill whenever the
  user wants to search for papers, find academic references, look up research
  on a topic, or query Semantic Scholar — even if they just say "find me papers
  about X" or "what's been published on Y."
allowed-tools: Read, Bash
---

# Semantic Scholar Query Skill

Search the Semantic Scholar API for academic papers. This skill wraps a shared
script that other skills (e.g., `/zotero`) also use, ensuring consistent S2
interaction across the grant-writing toolkit.

---

## Argument Dispatch

Parse `$ARGUMENTS` (the text after `/s2-query`) as the search query.
If empty, ask the user for search terms.

---

## Step 0 — Check API Key

```bash
test -n "$SEMANTIC_SCHOLAR_API_KEY" || echo "NO_S2_KEY"
```

If missing, stop with:
> ⚠️ `$SEMANTIC_SCHOLAR_API_KEY` not set.
> Get a key at https://www.semanticscholar.org/product/api
> Then: `export SEMANTIC_SCHOLAR_API_KEY='your-key'`

---

## Step 1 — Run Search

Use the shared script:

```bash
python ~/.claude/skills/s2-query/scripts/s2_search.py "<query>" [options]
```

### Available options

| Flag | Description | Example |
|---|---|---|
| `--limit N` / `-n N` | Max results (default: 10, max: 100) | `-n 20` |
| `--year RANGE` | Year filter | `--year 2022-2025` |
| `--min-citations N` | Minimum citation count | `--min-citations 50` |
| `--offset N` | Pagination offset | `--offset 10` |
| `--quiet` / `-q` | Suppress stderr table (JSON only) | `-q` |

The script outputs:
- **stderr**: a human-readable table (shown to the user)
- **stdout**: a JSON array of S2 paper objects (for piping)

### Infer filters from context

If the user's request implies filters, apply them:
- "recent papers on X" → `--year 2023-2025`
- "highly cited work on X" → `--min-citations 50`
- "seminal papers on X" → `--min-citations 100`
- "just a few" → `-n 5`

---

## Step 2 — Present Results

The script prints a table to stderr. After running, ask the user what they
want to do with the results:

- **Add to library**: pipe to the zotero sync script:
  ```bash
  python ~/.claude/skills/s2-query/scripts/s2_search.py "<query>" -q | \
    python ~/.claude/skills/zotero/scripts/zotero_sync.py --repo-dir . add
  ```
  Or if the user selected specific papers, filter the JSON first and pipe
  the selection.

- **Just browse**: no further action needed — the table is already displayed.

- **Refine**: re-run with different filters or a modified query.

---

## Integration with other skills

This script is the single source of truth for S2 queries. Other skills use it:

- **`/zotero search`** — runs the script, presents results, pipes selections
  to `zotero_sync.py add`
- **`/train-reviewers`** — subagents call the script for domain research
  (with `--year` and `--min-citations` filters)
- **`/grant-write`** — inline reference resolution delegates to `/zotero search`,
  which uses this script

When modifying the S2 query logic, update the script — all skills benefit.
````
