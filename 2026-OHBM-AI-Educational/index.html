# If you take three things from that book…

.boxed-content[
**1 · We are (mostly) amateur software engineers.**
Most scientists were never trained to write code — and AI does not fix that, it raises the stakes.

**2 · You own every line the AI writes.**
> "Any code generated by an AI coding tool *must* be verified to ensure that the computations are correct."

**3 · The discipline is what makes it work.**
Tests first · version control · a *constitution* + *memory* files · domain expertise in the loop.
]

.center[*…and for the next 20 minutes, I'll show you these three in practice.*]

???

- Three grounded takeaways (drop the dramatic retraction story per direction).
- #2 quote is verbatim Poldrack. #3 is the bridge into the three moves.

---

# A word for the postdocs in the room

.boxed-content[
.pull-left[
**Remember the radiologists?**

We were told AI would replace them. It didn't — because *validation* needs expert judgment, and that bottleneck protected the profession.

(María just showed you exactly why.)
]
.pull-right[
**But the devops and the workflows** —

the "glue," the pipelines, the cluster wrangling — are exactly what AI does *well*.

That is a large part of what a postdoc does today.
]
]

.center[
### This is your edge, not your obituary.

Learn to drive these tools — and to **catch them when they're wrong** — before something else does.
]

???

- Empowering-but-honest: name the exposure plainly, frame the course as the edge.
- Callback to María's validation bottleneck; extends Brent's Luddite point.

# Three moves

.boxed-content[
**1 · A piece of advice** — start small, on projects that aren't even science.
*(my CV manager, grant handling, literature-search skills)*

**2 · A first-person story** — how I made an AI run 2,000+ subjects through fMRIPrep while I never logged into the cluster.

**3 · A grounding experiment** — where LLMs go wrong on real neuroimaging code, and the *structure* that catches them.
]

.center[*One thread through all three:* **structure turns LLM speed into _trustworthy_ speed.**]

???

- Roadmap. The "one thread" line is the spine of the whole talk.

---

# Move 1 · Start where it doesn't (yet) matter

.boxed-content[
Don't learn to fly an AI on your **flagship pipeline.**

Start on small, **low-stakes** projects — ideally ones that aren't even science:

- the cost of a mistake is *near zero*,
- the feedback loop is *fast*,
- you learn the **tooling and the failure modes** before they can touch your data.
]

.center[*Then bring those habits back to the code that matters.*]

???

- Kicker "Move 1" orients the audience; no separate divider slide (budget).

# Move 1 · Four things I built first

.boxed-content[
.pull-left[
**CV manager** — `publications_index`

One YAML file &rarr; APA, BibTeX, Spanish CVA and NIH biosketch; CI refreshes citation counts.

<br />

**Manuscript handling** — PCI Registered Reports

Drafts personalized reviewer invitations straight from the editorial workflow.
]
.pull-right[
**Grant handling** — `~/Grants`

Skills + agent review *panels* that draft, lint and stress-test proposals against funder rubrics.

<br />

**Literature skills** — `/s2-query` + `/zotero`

Search Semantic Scholar, sync Zotero &harr; a CSL-JSON library. *(demo next)*
]
]

.center[*Not one of these is "science" — every one taught me how the tools behave.*]

???

- All four are real, private repos. Keep this fast (~45 s): the point is "low-stakes reps."

# Move 2 · A challenge I set myself

.boxed-content[
.pull-left[
February 2026. A project I'd been **putting off for years:**
run **all of ABIDE I + II** through fMRIPrep.

~2,200 subjects. 43 sites. An HPC cluster.
A heavy lift I never felt like starting.
]
.pull-right[
So I changed the question:

### "Can I make *Claude Code* do it — and never log into the cluster myself?"

…then I pulled up my wallet. *(more on that later.)*
]
]

???

- Personal stakes: a lift I'd avoided; reframed as "make the AI do it."
- Wallet line is a deliberate tease for the cost bookend (slide 18). No number here.

# Move 2 · …and it did

.boxed-content[
A **YODA / DataLad** superdataset, driven end-to-end by an agent:

.center[`SLURM job array` &rarr; `reconcile` site branches &rarr; `audit` annex &rarr; `publish overlay`]

- ~2,200 subjects · 43 sites · fMRIPrep 25.2.4 on **Curnagl** (UNIL HPC)
- every run wrapped in `datalad containers-run` — **full provenance**
- it even **detected and recovered "ghost" subjects** (lost data) on its own
]

![:img ABIDE project timeline, Feb to Apr 2026, 100%](images/abide-timeline.png)

???

- "Show the SLURM/DataLad chain" — the automated pipeline IS the proof of delegation.
- This is the "HPC glue" my abstract promised. ~266 small commits, two months.

---

# Move 2 · Did the science survive?

.boxed-content[
.pull-left[
I replicated **Abraham et al. (2017)** — autism classification from resting-state connectivity.

**The preprocessing choice (C-PAC vs fMRIPrep) explained &lt; 1 % of the accuracy gap.**

A real, defensible result — produced mostly by an agent.
]
.pull-right[
**But here is the part that matters:**

it only held together because **I was watching the whole time** —

reading the diffs, catching the ghosts, sanity-checking every number.

*Delegation, not abdication.*
]
]

.center[*That vigilance is the whole next move.*]

???

- One line on the result, then pivot hard to the caveat → bridge into Move 3 (grounding).
