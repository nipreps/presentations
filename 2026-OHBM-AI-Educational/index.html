# If you take three things from that book…

.boxed-content[
**1 · We are (mostly) amateur software engineers.**
Most scientists were never trained to write code — and AI does not fix that, it raises the stakes.

**2 · You own every line the AI writes.**
> "Any code generated by an AI coding tool *must* be verified to ensure that the computations are correct."

**3 · The discipline is what makes it work.**
Tests first · version control · a *constitution* + *memory* files · domain expertise in the loop.
]

.center[*…and for the next 20 minutes, I'll show you these three in practice.*]

???

- Three grounded takeaways (drop the dramatic retraction story per direction).
- #2 quote is verbatim Poldrack. #3 is the bridge into the three moves.

---

# A word for the postdocs in the room

.boxed-content[
.pull-left[
**Remember the radiologists?**

We were told AI would replace them. It didn't — because *validation* needs expert judgment, and that bottleneck protected the profession.

(María just showed you exactly why.)
]
.pull-right[
**But the devops and the workflows** —

the "glue," the pipelines, the cluster wrangling — are exactly what AI does *well*.

That is a large part of what a postdoc does today.
]
]

.center[
### This is your edge, not your obituary.

Learn to drive these tools — and to **catch them when they're wrong** — before something else does.
]

???

- Empowering-but-honest: name the exposure plainly, frame the course as the edge.
- Callback to María's validation bottleneck; extends Brent's Luddite point.

---

# Three moves

.boxed-content[
**1 · A piece of advice** — start small, on projects that aren't even science.
*(my CV manager, grant handling, literature-search skills)*

**2 · A first-person story** — how I made an AI run 2,000+ subjects through fMRIPrep while I never logged into the cluster.

**3 · A grounding experiment** — where LLMs go wrong on real neuroimaging code, and the *structure* that catches them.
]

.center[*One thread through all three:* **structure turns LLM speed into _trustworthy_ speed.**]

???

- Roadmap. The "one thread" line is the spine of the whole talk.
