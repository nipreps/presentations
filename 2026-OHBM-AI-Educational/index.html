# Before we touch any code — three things

.boxed-content[
<br />

.large[**1 · AI does not plug training gaps.**]

.larger[Most scientists were never trained to write code — AI just raises the stakes.]

<br />

.large[**2 · You own every line the agent writes.**]

> "Any code generated by an AI coding tool *must* be verified to ensure that the computations are correct." — *Poldrack*

<br />

.large[**3 · Structure, not vigilance.**]

.larger[A constitution · version control · provenance · domain expertise in the loop · plan mode — the scaffolding that makes a *fast* collaboration *trustworthy*.]
]

???

- #2 quote is verbatim Poldrack — *Better Code, Better Science* (the authoritative source; one-line nod, no full embed).
- #3 reframes the whole talk: structure is scaffolding for a partnership, **not** a cage to police a tool.

---

# What I'll show you

.boxed-content[
**1 · Start small** — practice on projects that aren't even science.

**2 · Delegate a real run** — driving ~2,200 subjects through fMRIPrep on an HPC cluster, while I never log into it — and the real bugs we fixed *together*.

**3 · When a good model isn't enough** — where it still fabricates, and the *grounding* that fixes it.
]

.center[*One thread through all three:* **structure turns LLM speed into _trustworthy_ speed.**]

???

- Roadmap. No "moves/phases" language — three plain threads. The "one thread" line is the spine.

---

# This is your edge, not your obituary

.boxed-content[
.pull-left[
<img src="images/20250514-new-york-times.png" alt="The New York Times, 2025 — Your A.I. Radiologist Will Not Be With You Soon" style="width: 100%" />

.center[*The New York Times · May 14, 2025*]
]
.pull-right[
<br />
The headlines argue about whether AI replaces the expert.

But the **devops and the workflows** — the "glue," the pipelines, the cluster wrangling — are exactly what AI does *well*. That is a large part of what a postdoc does today.

.center[### Learn to drive these tools — and keep your judgment in the loop — before something else does.]
]
]

???

- Compresses the New Yorker + NYT + "however" run into one. Callback to María; extends Brent's point.

---

# Start where it doesn't (yet) matter

.boxed-content[
Don't learn to fly an AI on your **flagship pipeline.** Start on small, **low-stakes** projects — ideally ones that aren't even science: near-zero cost of mistakes, fast feedback, and you learn the **failure modes** before they touch your data.

.pull-left[
**CV manager** — one YAML &rarr; APA, BibTeX, Spanish CVA, NIH biosketch.

**Manuscript handling** — drafts reviewer invitations from the editorial workflow.
]
.pull-right[
**Grant handling** — skills + review *panels* that lint proposals against funder rubrics.

**Literature skills** — `/s2-query` + `/zotero`: search Semantic Scholar, sync a CSL-JSON library.
]
]

.center[*Not one of these is "science" — every one taught me how the tools behave. (demo next)*]

???

- All four are real, private repos. Keep fast (~45 s): the point is "low-stakes reps."

# A challenge I set myself

.boxed-content[
.pull-left[
February 2026. A project I'd been **putting off for years:**
run **all of ABIDE I + II** through fMRIPrep.

~2,200 subjects. 43 sites. An HPC cluster.
A heavy lift I never felt like starting.
]
.pull-right[
So I changed the question:

### "Can I get *Claude Code* to drive it — while I never log into the cluster myself?"

…then I pulled up my wallet. *(more on that later.)*
]
]

???

- Personal stakes: a lift I'd avoided; reframed as "delegate the execution." Wallet line teases the cost bookend.

# …and it did

.boxed-content[
A **YODA / DataLad** superdataset, driven end-to-end by the agent **under my direction:**

.center[`SLURM job array` &rarr; `reconcile` site branches &rarr; `audit` annex &rarr; `publish overlay`]

- ~2,200 subjects · 43 sites · fMRIPrep 25.2.4 on **Curnagl** (UNIL HPC)
- every run wrapped in `datalad containers-run` — **full provenance**
]

![:img ABIDE project timeline, Feb to Apr 2026, 100%](images/abide-timeline.png)

???

- The automated pipeline IS the proof of delegation. ~480 commits, two months; this is the "HPC glue" my abstract promised.

# The division of labor starts in writing

.boxed-content[
I own the **specification**; the agent executes inside it. That contract lives in a `CLAUDE.md`:

```markdown
## Code conventions
- Python scripts use only stdlib (no pip dependencies beyond DataLad ecosystem)
- `build_abide_both.py` supports `--dry-run` for safe testing
- Shell scripts use `set -euo pipefail`
- Scripts must be runnable from repo root using relative paths
- Commit style: conventional prefixes (`enh:`, `fix:`, `doc:`, `chore:`)
```

.center[*All executions recorded with `datalad containers-run` — provenance is non-negotiable.*]
]

???

- Verbatim: `abide_fmriprep/CLAUDE.md` lines 390–396. The rules are the spec I own; the agent works within them.

---

# A bug we fixed together

.boxed-content[
Shell globs were passed **literally** to `datalad get/drop` — "path does not exist." I named the invariant (*only fetch symlinks that exist*); the agent wrote the guarded loop:

```diff
-datalad get "${SUBJECT}/ses-1/func/..._space-MNI152NLin2009cAsym_desc-preproc_bold.nii.gz"
+for f in ${SUBJECT}/ses-1/func/..._space-MNI152NLin2009cAsym_desc-preproc_bold.nii.gz; do
+    [ -L "$f" ] && datalad get "$f" 2>/dev/null || true
+done
```
]

.center[`fix: resolve globs before passing to datalad get/drop` — co-authored, in the provenance record.]

???

- Verbatim hunk from commit `4b9e640` (`code/analysis_extract.sbatch`); middle of the glob path abbreviated to fit.
- Honest framing: normal engineering friction, diagnosed *with* the agent, resolved *under* my direction.

# At scale, new failure modes appear

.boxed-content[
After a push race, some subjects had **metadata on `master` but their data stranded** on a compute node ("ghost subjects"). The agent can sweep all 2,194 subjects to find them; **I** decide what counts as a ghost and what to do:

```bash
for sub in $(git ls-tree --name-only master | grep '^sub-'); do
  missing=$(git annex find --in here --not --copies-of web -- "$sub/" | wc -l)
  [[ "$missing" -gt 0 ]] && echo "$sub: $missing files with no remote copy"
done
```
]

.center[*Division of labor: breadth from the agent, judgment from me.* — `enh: add reusable ghost subject cleanup script`]

???

- Detection snippet verbatim from `docs/HANDOVER.md §1.1` (trimmed one `grep`). Operational failure, not an "AI mistake."
- Cleanup written under direction: commits `8f94b75f` / `522b77a6`.

# An honest record

.boxed-content[
.pull-left[
**62 of ~480 commits** carry an agent co-author. Every one:

- has **me as sole author** — I read it and committed it,
- uses a **conventional, semantic** message,
- is **small and revertible.**

.center[*The partnership is visible — not hidden.*]
]
.pull-right[
```

     to datalad get/drop

Shell globs in datalad get arguments
are passed literally (not expanded)...

Co-Authored-By: Claude Opus 4.6
  (1M context) <noreply@anthropic.com>
```
]
]

???

- `git log --grep='Co-Authored-By: Claude' | wc -l` &rarr; 62. Trailer verbatim from commit `4b9e640`.

# Did the science survive?

.boxed-content[
.pull-left[
I replicated **Abraham et al. (2017)** — autism classification from resting-state connectivity.

**The preprocessing choice (C-PAC vs fMRIPrep) explained &lt; 1 % of the accuracy gap.**

A real, defensible result — *executed* mostly by the agent.
]
.pull-right[
**Why it held together:**

I never gave up the **specification** or the **judgment** — what to run, what "correct" means, which numbers to trust.

The agent carried the **execution.**

*Delegation, not abdication.*
]
]

.center[*That division of labor is exactly where the next problem hides.*]

???

- One line on the result, then pivot to the limit that motivates grounding.

---

# But a good model has a ceiling

.boxed-content[
<br />
The partnership scales. Then it hits a wall:

when the agent needs to know **exactly how a tool behaves** — a flag, an API, a default — a good model **fabricates.** Giving it the web (`WebFetch`) fixes the answer, but it is **slow, costly, and brittle.**

<br />

.center[### Some problems need a more solid foundation than a good model + a search box.]

<br />

.center[That foundation is **grounding.**]
]

???

- The honest motivation for the wiki: the *natural next step after ABIDE*, not a side experiment. Ties to Ben Dichter's RAG talk.

---

# Where it fabricates

.boxed-content[
I asked an agent a **trap question:**
*"Which QSIPrep flag writes outputs in MNI space?"*

.pull-left[
**What it confidently answered**

`qsiprep … --output-spaces`
`MNI152NLin2009cAsym`
]
.pull-right[
**The truth**

QSIPrep has **no `--output-spaces` flag** — that is fMRIPrep's. The premise was false, and the model played along.
]
]

.center[*Fluent. Confident. Wrong.* — a hallucinated API is a coding bug waiting to happen.]

???

- The premise itself is false; the model invents the flag. Caught and corrected in commit `91048ab`.

---

# A grounded foundation

.boxed-content[
So I built one: an **LLM-wiki** on dMRI preprocessing the agent can retrieve from.

- humans **dump** raw notes; agents **curate** structured, cited pages
- **cite a source, or it doesn't ship** — enforced by a **deterministic linter** on every commit
- so even the curation is **verifiable**, not blind trust
]

.center[*This is grounding **infrastructure** — not a template for how to write your pipeline.*]

???

- Ben taught you RAG; here it is, built and measured for code questions.
- The caveat is deliberate: in the wiki I *do* let the agent curate — the citation rule + linter are what make that safe.

# Measured: grounding beats a bigger search (*n*=30)

.boxed-content[
<object type="image/svg+xml" data="images/qsiprep-grounding.svg" style="width: 100%; padding-top: 40pt;"></object>
]

.center[*From memory: instant, cheap, **always wrong**. Web: right, but slow &amp; expensive. Wiki: **right, fast, cheap.***]

???

- Per-arm averages (from `qsiprep-hallucination.cast`): memory ≈ USD 0.02 / 12 s / 5-of-5 wrong; web ≈ USD 0.33 / 142 s / 0 wrong; wiki ≈ USD 0.09 / 28 s / 0 wrong.

# The bug no rule caught — but the collaboration did

.boxed-content[
.pull-left[
The citation rule kills hallucinated **flags:** try to cite a made-up flag and it has **nowhere to hide.**

But it never caught **this:** a silent **ordering bug** — motion correction fit against a still-distorted reference. Grounding made *me* read the code closely enough to see it.
]
.pull-right[
![:img dMRIPrep F0080 ordering bug, 92%](images/dmriprep-f0080.png)
]
]

.center[*Tools ground the claims; judgment grounds the science.*]

???

- Three layers: the source-grounding rule (kills flag hallucinations), the deterministic linter (schema/links), and human judgment (the F0080 ordering bug).

---

# Set up your own project for the agent

.boxed-content[
Everything you saw is just **three things and a habit:**

**1 · A constitution** — `CLAUDE.md` / `AGENTS.md`: scope, conventions, the rules the agent works within. *(you saw ABIDE's)*

**2 · Provenance &amp; memory** — every run and decision recorded as you go.
*(Poldrack prescribes exactly this — I arrived at it independently.)*

**3 · Small, semantic commits** — every change reviewable and revertible. *(the 62)*
]

.center[*Provenance and reviewability stop being extra work — they become the substrate.*]

???

- Actionable recap; each item ties back to where it appeared. `AGENTS.md` = the vendor-neutral `CLAUDE.md`.

---

# …then remember you work with humans

.boxed-content[
An AI can write a **2,000-line pull request in four minutes.**
That cost doesn't vanish — it lands on whoever has to **review** it.

- **Keep PRs small and curated** — reviewable by a human, not a wall of generated diff.
- **Trace every change to an issue** — no unsolicited mega-PRs nobody asked for.
- **Write your own commit &amp; PR messages** — concise and honest, not AI slop.
- **Never paste secrets or unlicensed code** into a prompt.
]

.center[*You own every line — including the social cost of shipping it.*]

???

- The open-source social contract. Pointed for an audience building shared tools.

---

# The catch nobody puts on a slide

.boxed-content[
.pull-left[
This is **expensive**, and the bill is **uneven.**

PIs can afford the premium tiers. PhD students and postdocs get pushed to the cheapest. **Open Science — and whole regions — risk being priced out.**
]
.pull-right[
**But remember the experiment:**

a **grounded cheap model was right** where an ungrounded one fabricated every time.

**Structure is a democratizing lever.** Local models lag the frontier today — closing that gap is the work.
]
]

.center[*Cheaper, grounded, reproducible — that isn't a compromise. It's the goal.*]

???

- Cost bookend; reuses the experiment as the hopeful hinge. Extends Brent's "profit-driven" point.

---

# The one thing to take home

.boxed-content[
| What kept the partnership honest | What it bought |
|---|---|
| **A constitution I wrote** | the agent executes within my spec |
| **Cite a source, or it doesn't ship** | no invented `--output-spaces` flag |
| **Provenance + small commits** | every change reviewable &amp; revertible |
| **My judgment in the loop** | the silent F0080 ordering bug |
]

.center[
### Structure turns LLM *speed* into **trustworthy speed.**

Read the book &middot; [bettercodebetterscience.github.io](https://bettercodebetterscience.github.io/book/index.html) &middot; *questions?*
]

???

- Synthesis table (collaboration enabler ↔ payoff) + the through-line CTA. Book URL stays up for Q&A.
