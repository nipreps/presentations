# fMRIPrep is robust, standardized, and minimal

.boxed-content.center[
<object type="image/svg+xml" data="../assets/fmriprep-natmeth-fig01-inkscape.svg" style="width: 75%;"></object>

???

What do I mean by that? The pipeline is robust in that it has minimal requirements
(T1w and BOLD images), but adaptive in that it can utilize additional scans when available
(e.g. fieldmaps, T2w images, additional echos).

And it's standardized in the sense that it accepts BIDS formatted datasets,
makes processing decisions based on the discovered metadata,
and produces outputs in standardized formats for further processing.

It is minimal in that it is agnostic to downstream analysis, so it refrains from spatial
smoothing or temporal filtering.

* Functional

.pull-left.center[

.pull-right.larger[

Building off the success of fMRIPrep, NiPreps are:

* **BIDS first** &mdash; query datasets and adapt

* **Minimal** &mdash; stop where consensus stops, emit analysis-agnostic derivatives

* **Self-reporting** &mdash; visual reports, citation boilerplate

]

.pull-right.larger[

The NiPreps follow a "**glass-box**" design philosophy.
Users are expected and empowered to understand the processing that is done.

# NiPreps design principles

* Input: BIDS-formatted data.
* Process: Intelligently adapts to available data (e.g., uses field maps if present, but doesn't fail if not). This robust design is key to handling heterogeneity.
* Output: BIDS Derivatives including:
  1. Intuitive visual QC reports.
  1. Analysis-agnostic derivatives (confounds, brain masks).
  1. Reusable, pre-computed transformations. (This sets the stage for the next slide).

# Fit+transform isolates expensive or probabilistic work

.boxed-content.center[
<object type="image/svg+xml" data="../assets/fmriprep-fit-transform-inkscape.svg" style="width: 100%; padding-top: 20pt"></object>

]

???



* Concept: We separate expensive computation from flexible application.
* FIT (Compute-Heavy): Run once. Example: Calculating the complex nonlinear registration from a subject's T1w to a template. This is slow and difficult. The result is a set of warp files.
* TRANSFORM (Lightweight): Run as needed. Example: Using that warp to resample a BOLD file into the template space. This is fast and easy.
* Key Message: NiPreps does the heavy "fitting" for you. You can then perform the lightweight "transform" to any space you need, on demand.

---

# NiPreps and the FAIR principles

* Interoperability (I): Outputs are in BIDS Derivatives format, a community standard.
* Reusability (R): The "Fit+Transform" model makes derivatives radically more reusable. Instead of one giant, pre-packaged output, you get flexible components to build your desired final product.

.section-mark.center[
# NiPreps in Practice
## Three perspectives
]

---

# Perspective: Dataset creators

* Goal: Maximize impact.
* Action: Run fMRIPrep. Share raw BIDS data + the minimal "fit" derivatives (warps, confounds, reports).
* Their job ends here. They have produced a highly valuable, reusable, and compact asset.
---

# Perspective: Secondary analyst

* Goal: Use that shared data for a new analysis.
* The Question: How do we actually use these minimal derivatives? What does it look like to perform the "transform" step ourselves?

---

# Perspective: Secondary analyst - Demo

---

# Perspective: Secondary analyst - Wrap-up

* The Problem: How did I know that my Python environment had the right version of nitransforms? How do we run that fmriprep command from Part 1?
* The Answer: Environment management (lock-files, containers)

---

# Perspective: Data archivist

* Goal: Balance cost and value.
* The Takeaway: "Having seen how powerful and flexible the minimal 'fit' derivatives are, the archivist's choice is clear. Storing these small warp files instead of huge, pre-resampled 4D images is a massive win for storage costs, transfer bandwidth, and long-term reusability."

---

# Compute Once, Reuse Forever

* Our live demo is sustainability in action. We avoided re-running the expensive "fit" step.
* Store Smart, Not Big: The archivist saves energy on storage and transfer by holding the minimal derivatives.

* NiPreps standardizes preprocessing for heterogeneous data.
* The "Fit+Transform" design is the key to this, separating expensive computation from flexible application.
* This model is practical (as we just saw!), promotes FAIR principles, and enables a more sustainable research lifecycle.
