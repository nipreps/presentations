# Define (neuroimaging) workflow

.boxed-content[
.distribute.large[
* Workflow as a recipe or a path on a roadmap:
  * Define the *input* and the *output*
  * Analysis tasks or steps
  * Computation graph (*connect* tasks/steps)
  * Execution of the graph

* How to describe the recipe:
  * Workflow Description Language (WDL): *Nextflow*
  * Explicit programming: *Nipype*, *Scikit-Learn*'s ``Pipeline``
]
]

# WDL Example (Nextflow)

.tiny[
```WDL
params.input_dir = 'data'
params.output_dir = 'results'

process fsl_preprocess {
  input:
  file input_image from "$input_dir/input.nii.gz"

  output:
  file "${params.output_dir}/preprocessed.nii.gz"

  script:
  """
  bet $input_image ${params.output_dir}/brain.nii.gz
  flirt -in $input_image -ref MNI152_T1_2mm_brain.nii.gz -omat ${params.output_dir}/transformation.mat
  """

}

process fsl_stats {
  input:
  file input_image from fsl_preprocess.output

  output:
  file "${params.output_dir}/stats.nii.gz"

  script:
  """
  fslstats $input_image -m > ${params.output_dir}/mean.txt
  fslstats $input_image -p 50 > ${params.output_dir}/median.txt
  """

}

workflow {
  fsl_preprocess | fsl_stats
}
```
]

# WDL Example - Translation into Nipype


```Python
import nipype.interfaces.fsl as fsl
import nipype.pipeline.engine as pe

input_image = 'input.nii.gz'
output_dir = 'results'

preprocess = pe.Node(fsl.BET(), name='preprocess')
preprocess.inputs.in_file = input_image
preprocess.inputs.out_file = f'{output_dir}/brain.nii.gz'

stats = pe.Node(fsl.ImageStats(), name='stats')
stats.inputs.in_file = f'{output_dir}/brain.nii.gz'
stats.inputs.op_string = '-m -p 50'

workflow = pe.Workflow(name='my_workflow')
workflow.connect([(preprocess, stats, [('out_file', 'in_file')])])
workflow.base_dir = 'working_dir'
workflow.run()
```

# Facets to standardize

.boxed-content[
.distribute.large[
* **Outer interface** (inputs and outputs). Also, consider an internal data structure format for high throughput.
* **Implementation** (WDL vs. programmed): code styling, best practices, BIDS-Apps.
* **Modularize** (see *NiPreps* and *TemplateFlow*).
* Use **containers** to ensure software delivery and reproducibility.
* Implement testing and **continuous integration** to catch errors early and streamline development.
* **Version** the workflow and its components to ensure compatibility and track changes, issue **LTS**.
* Promote **community** and social standardization through collaboration, documentation, telemetry, and open-source practices.
* **Visual reporting**
]]

# "Analysis-grade" data

.larger[
The *NeuroImaging PREProcessing toolS* (*[NiPreps](https://nipreps.org).org*) augment scanners to produce *analysis-grade* data (= **directly consumable by analyses**)
]

<br />
.pull-left[

***Analysis-grade* data** is an analogy to the concept of "*sushi-grade (or [sashimi-grade](https://en.wikipedia.org/wiki/Sashimi)) fish*" in that both are:

.large[**minimally preprocessed**,]

and

.large[**safe to consume** directly.]
]
