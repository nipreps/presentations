# The problem: analytical variability

<p align="center">
<img src="../assets/narps.png" width="60%" /><br /><br />
(<a href="https://doi.org/10.1038/s41586-020-2314-9">Botvinik-Nezer et al., 2020</a>)
</p>

???

Neuroimaging research faces a critical challenge: the same dataset analyzed by different labs with different preprocessing pipelines can yield completely different results.

This analytical variability undermines the reproducibility and reliability of our findings.

---

# The research workflow

.boxed-content[
<object type="image/svg+xml" data="../assets/neuroimaging-workflow-large.svg" style="width: 100%; padding-top: 20pt;"></object>

.center[
[Esteban et al., (2020)](http://doi.org/10.1038/s41596-020-0327-3)
]
]

???

Preprocessing is not optional—it's a critical step that transforms raw scanner output into analysis-ready data.

From data acquisition through quality control, preprocessing, feature extraction, and final statistical modeling: each step matters.

---

# "Analysis-grade" data

.larger[
The *NeuroImaging PREProcessing toolS* (*[NiPreps](https://nipreps.org).org*) augment scanners to produce *analysis-grade* data.
]

<br />
.pull-left[

***Analysis-grade* data** is like "*sushi-grade fish*":

.large[**minimally preprocessed**,]

and

.large[**safe to consume** directly.]
]

.pull-right[
<img align="right" style='margin-right: 50px' src="https://raw.githubusercontent.com/nipreps/identity/refs/heads/main/nipreps-general/nipreps-transparent.png" width="80%" />
]

# NiPreps ecosystem

<p align="center">
<img src="../assets/nipreps-chart.svg" width="70%" /><br />
</p>

???

NiPreps is not a single tool but a growing ecosystem of specialized preprocessing pipelines.

fMRIPrep handles functional MRI. SMRIPrep tackles anatomical images. dMRIPrep processes diffusion data. And more are coming.

---
class: stepwise-svg

# fMRIPrep: despite minimal, highly complex

.boxed-content.center[
<object type="image/svg+xml" data="../assets/fmriprep-natmeth-fig01-inkscape.svg" style="width: 75%;"></object>
]

???

Just preprocessing is complex.

There's motion correction, distortion correction, brain extraction, registration to templates, nuisance signal identification—each step with many algorithmic choices.

---

# The individual report

<p align="center">
<video controls="controls" width="70%"
       name="Video Name" src="https://www.nipreps.org/assets/fmriprep-report.mov"></video>
</p>

???

Every participant gets an interactive report showing exactly what the pipeline did.

You can inspect brain extraction, registration quality, and motion patterns—visual quality assurance.

---

<p align="center">

These are real-time statistics from our GitHub releases.

# fMRIPrep: version management

<p align="center">
<img src="https://github.com/nipreps/fmriprep_stats/releases/latest/download/versionstream.png" width="90%" /><br />
</p>

.larger[
<i class="fa-solid fa-circle-right"></i> Exact versions matter for reproducibility

<i class="fa-solid fa-circle-right"></i> Long-term support (LTS) program
]

???

We track semantic versioning carefully. If you report which version you used, others can exactly reproduce your work.

---

# TemplateFlow: standardized brain templates

<p align="center">
<img src="https://www.templateflow.org/assets/templateflow_fig-birdsview.png" width="60%" /><br />
(<a href="https://doi.org/10.1038/s41592-022-01681-2">Ciric et al., 2022</a>)
</p>

???

Brain registration requires standard templates. TemplateFlow provides 80+ curated templates in a FAIR format.

No more hunting through 10 different websites for a template—it's all organized and versioned.

---

# Quality assurance and control

<p align="center">
<img src="../assets/mriqc-paper.png" width="70%" /><br />
(<a href="http://doi.org/10.1371/journal.pone.0184661">Esteban et al., 2017</a>)
</p>

???

MRIQC automatically extracts image quality metrics from your raw data.

This lets you identify problematic images before they bias your analysis.

---

.boxed-content.larger.no-bullet[

* .large[<i class="fa-solid fa-link"></i>] [**nipreps.org**](https://www.nipreps.org) — Overview and documentation

* .large[<i class="fa-solid fa-database"></i>] [**OpenNeuro**](https://openneuro.org) — Public datasets to test with

???

Everything is open source and free to use.

Start small: download an open dataset, organize it in BIDS format, and run fMRIPrep.
